# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Backend CI/CD - flightbooking-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  BACKEND_DIR: backend
  ARTIFACT_NAME: backend-package
  PACKAGE_ARCHIVE: backend-package.zip
  AZURE_WEBAPP_NAME: flightbooking-backend
  AZURE_SLOT_NAME: Production

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm install --legacy-peer-deps

      - name: Run backend tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run test --if-present -- --passWithNoTests

      - name: Prune dev dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm prune --production

      - name: Package deployable artifact
        run: zip -r ${{ env.PACKAGE_ARCHIVE }} ${{ env.BACKEND_DIR }} .deployment web.config

      - name: Upload backend artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PACKAGE_ARCHIVE }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
    environment:
      name: production
      url: https://flightbooking-backend-f0eafuafcpdaavfn.canadacentral-01.azurewebsites.net

    steps:
      - name: Download backend artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Verify artifact contents
        run: unzip -l ${{ env.PACKAGE_ARCHIVE }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C2BE4701318E4A94B6DC8E1E4FD30668 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7987E03DAD124361AD34B99DF1FF5FD0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_560A7FB26A3946FCB0E022A7641B226D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_SLOT_NAME }}
          package: ${{ env.PACKAGE_ARCHIVE }}

      - name: Logout from Azure
        if: always()
        run: az logout
          